# Continuous integration (decision 0009): every change to main is verified.
# If it passes, the site is published on GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # No Astro usage statistics from continuous integration.
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run check
      - name: Linter (and the boundaries between layers)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Headless tests
        run: npm run test
      # Alone, after the others: with tests running alongside, times go up to five times. Each budget
      # is measured against Rapier's own step on this machine (perf/budgets.perf.ts).
      - name: Performance budgets
        run: npm run perf
      - name: Browsers for the tests
        run: npx playwright install --with-deps chromium firefox webkit
      # Every test in Chromium; in Firefox and WebKit, the determinism check (the reference replays
      # played without drawing: it needs no WebGL). Their physics tests, which draw, run locally
      # before pushing (playwright.config.ts), and in the next step.
      - name: Browser tests (builds the site)
        run: npm run e2e
      # Firefox's and WebKit's physics tests, which draw (stage 4.5's close): their WebGL on Linux,
      # checked here before it is required. Not blocking yet: once it has passed here, this step loses
      # `continue-on-error` and the two browsers run them with the rest.
      - name: Firefox and WebKit drawing (checking their WebGL on Linux)
        continue-on-error: true
        env:
          DRAWING: '1'
        run: npx playwright test --project firefox --project webkit e2e/physics.e2e.ts
      - name: Keep the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - name: Playwright report (if something failed)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  publish:
    name: Publish to GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
