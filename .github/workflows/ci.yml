# Continuous integration (decision 0009): every change to main is verified.
# If it passes, the site is published on GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # No Astro usage statistics from continuous integration.
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run check
      - name: Linter (and the boundaries between layers)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Headless tests
        run: npm run test
      # Alone, after the others: with tests running alongside, times go up to five times. Each budget
      # is measured against Rapier's own step on this machine (perf/budgets.perf.ts).
      - name: Performance budgets
        run: npm run perf
      - name: Browsers for the tests
        run: npx playwright install --with-deps chromium firefox webkit
      # Every test in Chromium; in Firefox and WebKit, the determinism check and the physics tests, which
      # draw. Under a virtual display (Xvfb): headless Firefox on Linux finds GL only through a display,
      # and this machine has none. Without one, no WebGL at all ("Exhausted GL driver options", even with
      # WebGL forced): three can't make its renderer and the pages never step (0 of 9 on 2026-11-17).
      # With one, still headless, it draws on the CPU (Mesa's llvmpipe): 9 of 9, twice, in the step that
      # checked it here before it was required. (Chromium and WebKit pass with it as without: the physics
      # and determinism tests, 33 of 33 in the three browsers, under Xvfb in Playwright's Ubuntu 24.04 image.)
      - name: Browser tests (builds the site)
        run: xvfb-run -a npm run e2e
      - name: Keep the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      # The browser tests' HTML report, with each failed test's trace (playwright.config.ts): download it,
      # then `npx playwright show-report <its folder>`.
      - name: Playwright report (if something failed)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  publish:
    name: Publish to GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
